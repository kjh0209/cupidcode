name: Bug report
description: Something in the Cupid CLI, cupid connect or the docs doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste tokens, private code or other people's data. Security problems go to security@cupidcode.ai.
  - type: dropdown
    id: client
    attributes:
      label: Where did it happen?
      options: [Cupid CLI, Claude Code (cupid connect), Codex (cupid connect), OpenCode (cupid connect), Installer, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: env
    attributes:
      label: Versions and platform
      description: Output of `cupid --version` and `cupid connect status`, and your OS.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: cupid connect doctor (optional)
      description: Remove anything you consider private before pasting.
      render: text
